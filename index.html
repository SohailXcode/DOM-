<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>querySelector Demo</title>
  <script src="queryselector-demo.js" defer></script>
</head>
<body>
  <h1 id="title">querySelector Demo</h1>

  <div id="main">
    <p class="note">Note one</p>
    <p class="note important">Note two (important)</p>
    <p>Plain paragraph</p>
  </div>

  <ul id="fruits">
    <li>Apple</li>
    <li>Banana</li>
    <li>Mango</li>
  </ul>

  <input type="text" placeholder="Name">
  <input type="email" placeholder="Email">

  <hr>
  <h3>Try your own selector</h3>
  <input id="selInput" placeholder="e.g. .note or #fruits li">
  <button id="goBtn">Highlight</button>
  <p id="result"></p>
</body>
</html>
